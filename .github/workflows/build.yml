name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]

    steps:
      - name: Check out sources
        uses: actions/checkout@v4

      - name: Install LLVM (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-17 lld-17

      - name: Install LLD (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install lld
          echo "$(brew --prefix lld)/bin" >> "$GITHUB_PATH"

      - name: Verify toolchain
        shell: bash
        run: |
          "$CLANG" --version
          "$LLD_LINK" --version
          git --version
          python3 --version
        env:
          CLANG: ${{ runner.os == 'Linux' && 'clang-17' || 'clang' }}
          LLD_LINK: ${{ runner.os == 'Linux' && 'lld-link-17' || 'lld-link' }}

      - name: Build NTPWR
        shell: bash
        env:
          CLANG: ${{ runner.os == 'Linux' && 'clang-17' || 'clang' }}
          LLD_LINK: ${{ runner.os == 'Linux' && 'lld-link-17' || 'lld-link' }}
        run: bash BUILD.sh

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: NTPWR-${{ matrix.os }}
          path: |
            DIST/NTPWR.EXE
            DIST/NTPWR.SYS
          if-no-files-found: error
